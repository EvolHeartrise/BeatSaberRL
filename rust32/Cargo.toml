# f32 build of the Beat Arena Rust sim: same sources as ../rust, compiled
# with Real = f32 and exported as the Python module `beat_arena_rs32`.
# The bench's default engine (training runs the f32 CUDA kernel).
[package]
name = "beat-arena-rs32"
version = "0.1.0"
edition = "2021"

[lib]
name = "beat_arena_rs32"
path = "../rust/src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["f32"]
f32 = []
stats = []

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
