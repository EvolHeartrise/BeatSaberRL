[package]
name = "beat-arena-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "beat_arena_rs"
crate-type = ["cdylib"]

[features]
# Keeps the solver's introspection-only fields (ConstraintSet::jv_pre)
# and the weld-row effective-mass diagonal in a non-test build. Off by
# default: nothing in the solve reads them, and they cost a 35-wide dot
# per constraint row per substep. `cargo test` enables them implicitly.
introspect = []

# R26 instrumentation: per-substep rate counters (limit rows, contacts,
# ω-cap chol_solve_unit calls, step-11 clamp chol_solve_unit calls) that
# parameterize R21/R22/R27. Off by default and the SHIPPING BUILD MUST
# STAY THAT WAY: with the feature off the counting statements, the
# per-substep locals, and the Workspace::stats field all vanish at
# compile time, so the substep's codegen is identical to pre-R26.
# `pop_dbg_stats()` still exists in the default build — it returns zeros
# with enabled = 0, so the Python side never conditionalizes.
stats = []

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
