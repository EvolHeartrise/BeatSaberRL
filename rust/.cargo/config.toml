# target-cpu=native: the sim is dense scalar f64; AVX2 availability is
# worth ~5-15% here. Bit-safe: Rust emits no fast-math flags, so LLVM
# neither contracts a*b+c into FMA nor reassociates FP reductions — the
# f64-exact parity with the torch/CUDA envs survives. The artifact is
# machine-specific, which is fine for a locally-built maturin extension.
[build]
rustflags = ["-C", "target-cpu=native"]

# bare `cargo check`/`cargo build` configures pyo3 against the PATH
# python; if that interpreter is newer than pyo3 0.22 supports (> 3.13),
# export PYO3_PYTHON pointing at the venv interpreter. (The Windows box
# pinned it here — its PATH python was 3.14; maturin builds always use
# the venv interpreter and never need this.)
